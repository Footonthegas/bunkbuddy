<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>BunkBuddy</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/app-extra.css">
  <link rel="stylesheet" href="css/mobile.css" media="screen and (max-width: 768px)">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap"
    rel="stylesheet">
  <script src="js/anti-debug.js"></script>
  <style>
    @keyframes wave-drift {
      0% {
        transform: scale(1.4) translate3d(-2%, 3%, 0) rotate(-1deg);
      }

      50% {
        transform: scale(1.4) translate3d(2%, -3%, 0) rotate(1deg);
      }

      100% {
        transform: scale(1.4) translate3d(-2%, 3%, 0) rotate(-1deg);
      }
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .pro-glow-btn {
      position: relative;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.8);
      border: none;
      z-index: 1;
      cursor: pointer;
    }

    .pro-glow-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      height: 300%;
      background: conic-gradient(from 0deg, transparent 0%, transparent 40%, #fcd34d 45%, #f59e0b 50%, transparent 55%, transparent 100%);
      transform: translate(-50%, -50%);
      animation: rotate-lights 3s linear infinite;
      z-index: -2;
    }

    .pro-glow-btn::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #111;
      border-radius: 99px;
      z-index: -1;
    }

    .pro-glow-text {
      background: linear-gradient(135deg, #fcd34d, #f59e0b);
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
    }

    @keyframes rotate-lights {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* Pricing Card Styles */
    .pricing-card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s;
    }

    .pricing-card.recommended {
      border: 1px solid #fff;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
      background: #1a1a1a;
      transform: scale(1.02);
    }

    .price-badge {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .pricing-features {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.85rem;
      color: #a3a3a3;
    }

    .pricing-features li {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .pricing-features li i {
      color: #fff;
      font-size: 1rem;
    }

    .pricing-btn {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      margin: 20px 0;
      cursor: pointer;
      width: 100%;
    }

    .ethereal-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: #000;
      pointer-events: none;
    }

    #ethereal-bg-inner {
      position: absolute;
      inset: -60px;
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      animation: wave-drift 12s ease-in-out infinite;
      will-change: transform;
    }

    .styled-input {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 12px 18px;
      border-radius: 12px;
      font-family: var(--font-main);
      outline: none;
      transition: border-color 0.3s;
    }

    .styled-input:focus {
      border-color: var(--accent);
    }

    select.styled-input option {
      background: #111;
      color: #fff;
    }

    body {
      zoom: 1.25;
    }
  </style>
  <script>
    if (!localStorage.getItem('bb_session') || !localStorage.getItem('bb_data')) {
      window.location.replace('index.html');
    }
  </script>
</head>

<body>
  <!-- Optimized Hardware Accelerated Background Wrapper -->
  <div class="ethereal-wrap">
    <div id="ethereal-bg-inner" style="filter:url(#shadowoverlay) blur(2px);">
      <svg style="position:absolute; width:0; height:0;">
        <defs>
          <filter id="shadowoverlay" x="-20%" y="-20%" width="140%" height="140%">
            <!-- Stretched X frequency creates horizontal wave bands -->
            <feTurbulence result="undulation" numOctaves="1" baseFrequency="0.001 0.006" seed="0" type="fractalNoise" />
            <feColorMatrix in="undulation" type="hueRotate" values="0">
              <animate attributeName="values" from="0" to="360" dur="6s" repeatCount="indefinite" />
            </feColorMatrix>
            <feDisplacementMap in="SourceGraphic" in2="undulation" xChannelSelector="R" yChannelSelector="G">
              <animate attributeName="scale" values="30; 80; 30" dur="8s" repeatCount="indefinite" />
            </feDisplacementMap>
          </filter>
        </defs>
      </svg>
      <div
        style="background-color:rgba(128,128,128,1); mask-image:url('https://framerusercontent.com/images/ceBGguIpUU8luwByxuQz79t7To.png'); -webkit-mask-image:url('https://framerusercontent.com/images/ceBGguIpUU8luwByxuQz79t7To.png'); mask-size:cover; -webkit-mask-size:cover; mask-position:center; -webkit-mask-position:center; width:100%; height:100%;">
      </div>
    </div>
    <div
      style="position:absolute; inset:0; background-image:url('https://framerusercontent.com/images/g0QcWrxr87K0ufOxIUFBakwYA8.png'); opacity:0.05; mix-blend-mode: overlay; pointer-events: none; will-change: transform;">
    </div>
  </div>

  <script type="module" src="js/app.js?v=7"></script>

  <!-- Dynamic Page Loader -->
  <script>
    function showPageLoading() {
      const panels = document.querySelectorAll('.page-panel');
      panels.forEach(p => {
        if (!p.innerHTML.trim()) {
          p.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-secondary);"><i class="ph ph-spinner ph-spin" style="font-size:2rem;"></i><p style="margin-top:10px;">Loading...</p></div>`;
        }
      });
    }
    showPageLoading();

    async function loadPages() {
      const pages = ['home', 'academics', 'resources', 'attendance', 'connect', 'resultHub', 'pro', 'service', 'about', 'faq', 'refund', 'cancellation', 'shipping'];
      for (const page of pages) {
        try {
          const res = await fetch(`pages/${page}.html?v=${Date.now()}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const container = document.getElementById(`page-${page}`);
          if (container) container.innerHTML = text;
        } catch(e) {
          console.error('Failed to load ' + page, e);
          const container = document.getElementById(`page-${page}`);
          if (container) container.innerHTML = `<p style="padding:20px;color:#f87171;">Failed to load ${page} page. Please refresh.</p>`;
        }
      }
      window.__bb_pagesLoaded = true;
      document.dispatchEvent(new Event('pagesLoaded'));
    }
    loadPages();
  </script>
